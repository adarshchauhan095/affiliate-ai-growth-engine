<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Budget Deal 99 | Affiliate Content Management System</title>
  <meta name="description" content="Mobile-first Affiliate Content Management System for Budget Deal 99 with verified affiliate links, multi-platform content scheduling, and Safe Merge backup.">
  <meta name="theme-color" content="#090d16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Desktop Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar">
      <div class="brand">
        <div class="brand-logo">⚡</div>
        <div class="brand-text">
          <h2>Budget Deal 99</h2>
          <span class="badge-pro">ACMS Engine</span>
        </div>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-tab-target="tab-dashboard" id="nav-desktop-dashboard">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-tab-target="tab-products" id="nav-desktop-products">
          <span class="nav-icon">🏷️</span>
          <span>Product Registry</span>
        </button>
        <button class="nav-item" data-tab-target="tab-content" id="nav-desktop-content">
          <span class="nav-icon">🎬</span>
          <span>Content Library</span>
        </button>
        <button class="nav-item" data-tab-target="tab-distribution" id="nav-desktop-distribution">
          <span class="nav-icon">⚡</span>
          <span>Distribution Hub</span>
        </button>
        <button class="nav-item" data-tab-target="tab-comments" id="nav-desktop-comments">
          <span class="nav-icon">💬</span>
          <span>Comment Follow-ups</span>
        </button>
      </nav>

      <!-- Operational Sidebar Footnote -->
      <div class="sidebar-footer">
        <div class="worker-card">
          <div class="worker-header">
            <span class="pulse-indicator"></span>
            <span class="worker-title">Firestore Spark</span>
            <span class="worker-status-badge" id="cloud-sync-status">Ready</span>
          </div>
          <div class="worker-stat">
            <span>Associate Tag</span>
            <strong class="tag-pill">mybudgetdeal9-21</strong>
          </div>
          <div class="worker-stat">
            <span>Telegram Channel</span>
            <a href="https://t.me/budgetdeal99" target="_blank" rel="noopener noreferrer" class="link-muted">t.me/budgetdeal99 ↗</a>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Sticky App Bar -->
      <header class="topbar">
        <div class="topbar-brand-mobile">
          <span class="brand-icon">⚡</span>
          <span class="brand-title">Budget Deal 99</span>
        </div>

        <div class="topbar-actions">
          <button class="btn btn-sm btn-outline topbar-action-btn" id="btn-trigger-search" title="Universal Multi-Entity Search" aria-label="Search">
            <span class="btn-icon">🔍</span>
            <span class="btn-text-desktop">Search</span>
          </button>
          <button class="btn btn-sm btn-outline topbar-action-btn" id="btn-trigger-backup" title="Database Backup & Safe Merge Restore" aria-label="Backup">
            <span class="btn-icon">🛡️</span>
            <span class="btn-text-desktop">Backup</span>
          </button>
          <div class="auth-pill auth-guest" id="auth-status-pill" role="button" tabindex="0" title="Operator Session Management">
            <span>🔒 Operator</span>
          </div>
        </div>
      </header>

      <!-- View Containers (Routed via active tab) -->
      <div class="content-container">
        <!-- 1. Operational Dashboard -->
        <section class="tab-pane active" id="tab-dashboard" aria-label="Operational Dashboard"></section>

        <!-- 2. Product Registry -->
        <section class="tab-pane" id="tab-products" aria-label="Product Registry"></section>

        <!-- 3. Content Library -->
        <section class="tab-pane" id="tab-content" aria-label="Content Library"></section>

        <!-- 4. Distribution Links & Channels -->
        <section class="tab-pane" id="tab-distribution" aria-label="Distribution Hub"></section>

        <!-- 5. Comment Follow-ups -->
        <section class="tab-pane" id="tab-comments" aria-label="Comment Follow-ups"></section>
      </div>
    </main>

    <!-- Mobile-First Bottom Navigation Bar -->
    <nav class="bottom-nav" id="app-bottom-nav" aria-label="Mobile Bottom Navigation">
      <button class="bottom-nav-item active" data-tab-target="tab-dashboard" id="nav-mobile-dashboard">
        <span class="bottom-nav-icon">📊</span>
        <span class="bottom-nav-label">Dashboard</span>
      </button>
      <button class="bottom-nav-item" data-tab-target="tab-products" id="nav-mobile-products">
        <span class="bottom-nav-icon">🏷️</span>
        <span class="bottom-nav-label">Products</span>
      </button>
      <button class="bottom-nav-item" data-tab-target="tab-content" id="nav-mobile-content">
        <span class="bottom-nav-icon">🎬</span>
        <span class="bottom-nav-label">Content</span>
      </button>
      <button class="bottom-nav-item" data-tab-target="tab-distribution" id="nav-mobile-distribution">
        <span class="bottom-nav-icon">⚡</span>
        <span class="bottom-nav-label">Channels</span>
      </button>
      <button class="bottom-nav-item" data-tab-target="tab-comments" id="nav-mobile-comments">
        <span class="bottom-nav-icon">💬</span>
        <span class="bottom-nav-label">Comments</span>
      </button>
    </nav>
  </div>

  <!-- Dynamic Modal Overlay Container -->
  <div id="modal-container"></div>

  <!-- Notification Toasts Container -->
  <div id="toast-container" class="toast-stack" aria-live="polite"></div>

  <!-- Core ACMS Application Orchestrator -->
  <script type="module" src="app.js"></script>
</body>
</html>
